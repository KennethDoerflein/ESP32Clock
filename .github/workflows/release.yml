# .github/workflows/release.yml

name: Create Release and Upload Signed Firmware

# This action runs on every push to a tag that starts with "v" (e.g., v1.0.0, v2.1.3)
# or manually via workflow_dispatch with a specified tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Checkout the repository code (with full history and tags)
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2. If triggered manually for an existing tag (e.g. rebuilding a prior tag),
      #    check out that tag and ensure platformio.ini pins espressif32 @ ~6.12.0.
      - name: Prepare target ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            git fetch --tags --force
            if git rev-parse -q --verify "refs/tags/$INPUT_TAG" >/dev/null 2>&1; then
              echo "Tag $INPUT_TAG already exists; checking out refs/tags/$INPUT_TAG..."
              git checkout "refs/tags/$INPUT_TAG"
              sed -i 's/^platform = espressif32$/platform = espressif32 @ ~6.12.0/' platformio.ini
            else
              echo "Tag $INPUT_TAG does not exist yet; building current branch HEAD (${GITHUB_SHA})."
            fi
          fi

      # 3. Set up Python, which is a dependency for PlatformIO and signing
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # 4. Install PlatformIO Core and cryptography library for signing
      - name: Install dependencies
        run: |
          pip install -U platformio
          pip install pynacl

      # 5. Compile the project. This will generate the .bin file.
      - name: Build PlatformIO Project
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: pio run

      # 6. Sign the firmware binary
      - name: Sign Firmware
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "WARNING: OTA_SIGNING_KEY secret not configured. Skipping signature generation."
            echo "To enable secure OTA updates, add your Ed25519 private key as a repository secret."
            exit 0
          fi
          
          FIRMWARE_PATH=".pio/build/esp32s3_n16r8/firmware.bin"
          
          # Generate SHA-256 checksum
          sha256sum "$FIRMWARE_PATH" | cut -d' ' -f1 > "${FIRMWARE_PATH%.bin}.sha256"
          echo "SHA-256: $(cat ${FIRMWARE_PATH%.bin}.sha256)"
          
          # Sign firmware using Python with PyNaCl
          python3 << 'EOF'
          import sys
          import nacl.signing
          import nacl.encoding
          import hashlib
          import os

          # Read private key from environment (hex-encoded)
          key_hex = os.environ.get('OTA_SIGNING_KEY', '')
          if not key_hex:
              print("ERROR: OTA_SIGNING_KEY is empty")
              sys.exit(1)

          try:
              # Decode hex key (64 hex chars = 32 bytes)
              key_bytes = bytes.fromhex(key_hex)
              if len(key_bytes) != 32:
                  print(f"ERROR: Key must be 32 bytes, got {len(key_bytes)}")
                  sys.exit(1)
                  
              signing_key = nacl.signing.SigningKey(key_bytes)
          except Exception as e:
              print(f"ERROR: Failed to parse signing key: {e}")
              sys.exit(1)

          # Read firmware and compute SHA-256
          firmware_path = ".pio/build/esp32s3_n16r8/firmware.bin"
          with open(firmware_path, "rb") as f:
              firmware_data = f.read()

          firmware_hash = hashlib.sha256(firmware_data).digest()
          print(f"Firmware SHA-256: {firmware_hash.hex()}")

          # Sign the hash
          signed = signing_key.sign(firmware_hash)
          signature = signed.signature

          print(f"Signature: {signature.hex()}")

          # Write signature file
          sig_path = firmware_path.replace(".bin", ".sig")
          with open(sig_path, "w") as f:
              f.write(signature.hex())

          print(f"Signature written to {sig_path}")
          EOF

      # 7. Create/Push Git Tag and Create/Update GitHub Release
      - name: Create Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "ERROR: No release tag specified."
            exit 1
          fi

          # Create and push the git tag if it does not already exist on origin
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Creating and pushing new git tag: $RELEASE_TAG"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          else
            echo "Git tag $RELEASE_TAG already exists on origin."
          fi

          FILES=(".pio/build/esp32s3_n16r8/firmware.bin")
          if [ -f ".pio/build/esp32s3_n16r8/firmware.sig" ]; then
            FILES+=(".pio/build/esp32s3_n16r8/firmware.sig")
          fi
          if [ -f ".pio/build/esp32s3_n16r8/firmware.sha256" ]; then
            FILES+=(".pio/build/esp32s3_n16r8/firmware.sha256")
          fi

          # Look up an existing release (including drafts) strictly matching tag_name == RELEASE_TAG
          EXISTING_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" | head -n 1)

          if [ -n "$EXISTING_ID" ]; then
            echo "Updating existing release for tag $RELEASE_TAG (id: $EXISTING_ID)"
            gh release edit "$RELEASE_TAG" --title "Release $RELEASE_TAG"
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber
          else
            echo "Creating new draft release for tag $RELEASE_TAG"
            gh release create "$RELEASE_TAG" "${FILES[@]}" \
              --title "Release $RELEASE_TAG" \
              --notes "" \
              --draft \
              --verify-tag
          fi
